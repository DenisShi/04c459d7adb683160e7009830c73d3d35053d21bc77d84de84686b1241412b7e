name: phonebook

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      KEYCLOAK_DB_NAME: keycloak
      KEYCLOAK_DB_USER: keycloak
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      APP_DB_NAME: phonebook
      APP_DB_USER: phonebook
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-phonebook}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      APP_PUBLIC_URL: http://localhost:${APP_PORT:-4200}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n' >&3 &&
          read -r status_line <&3 &&
          [[ "$$status_line" == *" 200 "* ]]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    image: ${DOCKERHUB_NAMESPACE:-denisshi}/phonebook-backend:${PHONEBOOK_TAG:-latest}
    build: ./backend
    restart: on-failure
    environment:
      ConnectionStrings__PhoneBook: Host=postgres;Port=5432;Database=phonebook;Username=phonebook;Password=${APP_DB_PASSWORD:-phonebook};GSS Encryption Mode=Disable
      Keycloak__MetadataAddress: http://keycloak:8080/realms/phonebook/.well-known/openid-configuration
      Keycloak__ValidIssuer: http://localhost:${KEYCLOAK_PORT:-8080}/realms/phonebook
      Keycloak__Audience: phonebook-api
      Keycloak__RequireHttpsMetadata: "false"
    networks:
      - data
      - web
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  frontend:
    image: ${DOCKERHUB_NAMESPACE:-denisshi}/phonebook-frontend:${PHONEBOOK_TAG:-latest}
    build: ./frontend
    environment:
      KEYCLOAK_URL: http://localhost:${KEYCLOAK_PORT:-8080}
      KEYCLOAK_REALM: phonebook
      KEYCLOAK_CLIENT_ID: phonebook-spa
      API_UPSTREAM: http://backend:8080
    ports:
      - "${APP_PORT:-4200}:8080"
    networks:
      - web
    depends_on:
      backend:
        condition: service_healthy

networks:
  data:
  web:

volumes:
  postgres-data:
